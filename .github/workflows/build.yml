# Basic CI per the Kotlin Multiplatform guide
# (https://kotlinlang.org/docs/multiplatform/github-actions-for-kmp.html),
# adapted: module `:androidApp`, tests `:shared:testAndroidHostTest`,
# iOS project `iosApp/iosApp.xcodeproj` (its Run Script phase invokes the
# Gradle framework bridge, so JAVA_HOME from the composite action flows in),
# plus a data-driven test-count badge (`.github/badges/tests.json` → shields
# endpoint) fed by both test suites' JUnit XML.
name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

permissions:
  contents: write   # the badge job may commit an updated tests.json to main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Gradle setup
        uses: ./.github/actions/gradle-setup
      - name: Run shared tests on the JVM
        run: ./gradlew :shared:testAndroidHostTest
      - name: Emit host test count
        id: host-count
        run: |
          python3 -c "import glob,re,sys; files=glob.glob('shared/build/test-results/testAndroidHostTest/*.xml'); n=sum(int(x) for f in files for x in re.findall(r'tests=.([0-9]+).', open(f, encoding='utf-8', errors='ignore').read())); print('count='+str(n))" | tee /tmp/host-count.out | grep ^count=
          echo "host tests: $(grep -oE '[0-9]+' /tmp/host-count.out)"
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
      - name: Upload JUnit XML (host)
        uses: actions/upload-artifact@v4
        with:
          name: junit-host
          path: shared/build/test-results/testAndroidHostTest/*.xml

  test-ios:
    name: Run iOS native tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Gradle setup
        uses: ./.github/actions/gradle-setup
      - name: Run shared tests on the simulator
        run: ./gradlew :shared:iosSimulatorArm64Test
      - name: Emit native test count
        id: native-count
        run: |
          python3 -c "import glob,re,sys; files=glob.glob('shared/build/test-results/iosSimulatorArm64Test/*.xml'); n=sum(int(x) for f in files for x in re.findall(r'tests=.([0-9]+).', open(f, encoding='utf-8', errors='ignore').read())); print('count='+str(n))" | tee /tmp/native-count.out | grep ^count=
          echo "native tests: $(grep -oE '[0-9]+' /tmp/native-count.out)"
      - name: Upload JUnit XML (native)
        uses: actions/upload-artifact@v4
        with:
          name: junit-native
          path: shared/build/test-results/iosSimulatorArm64Test/*.xml

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [ test, test-ios ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Gradle setup
        uses: ./.github/actions/gradle-setup
      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  build-ios:
    name: Build iOS simulator app
    runs-on: macos-latest
    needs: [ test, test-ios ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Gradle setup
        uses: ./.github/actions/gradle-setup
      - name: Build iOS simulator app
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -configuration Debug \
            -scheme iosApp \
            -sdk iphonesimulator \
            ARCHS=arm64 \
            -derivedDataPath ./xcode-build \
            -verbose
      - name: Upload app folder
        uses: actions/upload-artifact@v4
        with:
          name: iphonesimulator-app
          path: xcode-build/Build/Products/Debug-iphonesimulator/*.app

  badge:
    name: Publish tests badge
    runs-on: ubuntu-latest
    needs: [ test, test-ios, build-android, build-ios ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Download count artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          merge-multiple: true
          path: junit/
      - name: Compute badge JSON
        run: |
          mkdir -p .github/badges
          python3 - .github/badges/tests.json <<'PY'
          import glob, json, re, sys
          files = glob.glob("junit/*.xml")
          total = sum(int(x) for f in files for x in re.findall(r'tests="([0-9]+)"', open(f, encoding="utf-8", errors="ignore").read()))
          json.dump({
              "schemaVersion": 1,
              "label": "tests",
              "message": "{} passed".format(total),
              "color": "brightgreen",
          }, open(sys.argv[1], "w"))
          print("badge: {} passed".format(total))
          PY
      - name: Commit badge when changed
        run: |
          if git diff --quiet -- .github/badges/tests.json; then
            echo "no badge change"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/badges/tests.json
            git commit -m "CI: update tests badge (auto)"
            git push origin main
          fi